<style>

html,body{height:100%;margin:0}

button,input,textarea{font:inherit;color:inherit}

.err{color:var(--danger);min-height:1.4rem;margin:.5rem 0 0;font-size:.9rem}

#app{height:100dvh;display:grid;grid-template-columns:92px 340px 1fr}

.tab{position:relative;background:none;border:0;color:var(--mut);font-weight:600;font-size:.85rem;padding:.75rem .25rem;border-radius:12px;cursor:pointer}

.pane{padding:1.75rem clamp(1rem,4vw,3rem);max-width:58rem;width:100%;margin:0 auto}
.row{display:flex}.row.me{justify-content:flex-end}
.bub{position:relative;max-width:min(34rem,82%);padding:.5rem .8rem .3rem;border-radius:18px;background:var(--sf2);overflow-wrap:anywhere}
.row.me .bub{background:var(--mine,var(--accent));color:var(--mon,var(--on));border-bottom-right-radius:6px}
.row.you .bub{border-bottom-left-radius:6px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:.75rem}

.set{margin-bottom:1.5rem}.set>p{margin:0 0 .5rem;color:var(--mut);font-size:.9rem}

#toast.show{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}

#chead .av{width:2.2rem;height:2.2rem;font-size:.9rem}
#chead .cm{line-height:1.2}
.bub.st{background:none!important;padding:0 .2rem}.stk{font-size:4rem;line-height:1.15;display:block}
.sp{position:absolute;bottom:calc(100% + .4rem);left:clamp(1rem,4vw,3rem);display:grid;grid-template-columns:repeat(6,1fr);gap:.2rem;background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:.5rem;box-shadow:0 8px 30px #0006;z-index:5}
.sp button{font-size:1.8rem;background:none;border:0;cursor:pointer;border-radius:8px;padding:.1rem .3rem}.sp button:hover{background:var(--sf2)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:grid;place-items:center;z-index:20;cursor:zoom-out}
#lb img{max-width:94vw;max-height:86vh;border-radius:8px}
#lb .bar{position:absolute;top:1rem;right:1rem;display:flex;gap:.5rem}
::view-transition-old(root),::view-transition-new(root){animation-duration:.2s}
@media(prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
@media(max-width:899px){
  #app{grid-template-columns:1fr!important;grid-template-rows:1fr auto}

  #nav .logo{display:none}.tab{flex:1}
  #side,#main{grid-row:1;grid-column:1}
  body[data-tab=chats]:not(.open) #main{display:none}
  body.open #side,body.open #nav{display:none}
  .back{display:block}
}
</style>

const SB_URL='https://nykmahodzdlmxcmmfdws.supabase.co',SB_KEY='sb_publishable_9S57J0ZN9FHp_XqBOrMFEw_zjcDrmfX',BUCKET='oper-files',MAX=50*1024*1024;

const L=`chats|Obrolan|Chats|チャット

const T={id:{},en:{},ja:{}};L.split('\n').forEach(r=>{const[k,a,b,c]=r.split('|');T.id[k]=a;T.en[k]=b;T.ja[k]=c});
let lang=pref('lang')||{id:'id',ja:'ja'}[navigator.language.slice(0,2)]||'en';
const t=k=>T[lang][k]||T.en[k]||k;

const ink=c=>{const n=parseInt(c.slice(1),16);return((n>>16)*299+(n>>8&255)*587+(n&255)*114)/1000>150?'#000':'#fff'};
function applyTheme(){const d=document.documentElement,a=pref('accent');d.dataset.theme=pref('theme')||'black';d.dataset.bub=pref('bub')||'round';const mi=pref('mine');if(mi){d.style.setProperty('--mine',mi);d.style.setProperty('--mon',ink(mi))}else{d.style.removeProperty('--mine');d.style.removeProperty('--mon')}if(a){d.style.setProperty('--accent',a);d.style.setProperty('--on',ink(a))}else{d.style.removeProperty('--accent');d.style.removeProperty('--on')}}

const S={me:null,prof:null,tab:'chats',peer:null,msgs:[],fr:[],pf:{},pp:{},mf:'all'};
const seen=new Set(),imgs=new Map();let primed=false,mode='in',ch=null;
const wide=()=>matchMedia('(min-width:900px)').matches;
const TABS=['chats','media','friends','settings'];
const peerOf=m=>m.sender_id===S.me?m.recipient_id:m.sender_id;
const name=id=>id===S.me?t('me'):((S.pp[id]||{}).display_name||'@'+(S.pf[id]||'?'));

const other=f=>f.requester===S.me?f.addressee:f.requester;
const friends=()=>S.fr.filter(f=>f.status==='accepted').map(other);
const isImg=n=>/\.(jpe?g|png|gif|webp|avif)$/i.test(n);
const size=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(0)+' KB':(b/1048576).toFixed(1)+' MB';

const preview=m=>m.kind==='file'?'📎 '+m.content:m.content;

function show(n){['auth','setup','app'].forEach(i=>$(i).hidden=i!==n)}

function applyLang(){document.documentElement.lang=lang;document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));$('un').placeholder='username';setMode(mode);if(S.me&&S.prof)render()}

/* ---- login ---- */
$('sw').onclick=()=>setMode(mode==='in'?'up':'in');
$('google').onclick=()=>sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});

  const{data,error}=mode==='in'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});

sb.auth.onAuthStateChange((_e,session)=>setTimeout(()=>boot(session),0));
async function boot(session){
  const uid=session&&session.user.id;
  if(uid&&uid===S.me)return;
  if(ch){sb.removeChannel(ch);ch=null}
  Object.assign(S,{me:uid||null,prof:null,msgs:[],fr:[],pf:{},pp:{},peer:null,tab:'chats'});seen.clear();imgs.clear();primed=false;
  if(!uid){show('auth');return}
  const{data}=await sb.from('profiles').select('*').eq('id',uid).maybeSingle();
  if(!data){show('setup');return}
  S.prof=data;S.pf[uid]=data.username;S.pp[uid]=data;enter();
}
function enter(){show('app');S.peer=wide()?S.me:null;render();loadAll();
  ch=sb.channel('oper-'+S.me).on('postgres_changes',{event:'*',schema:'public',table:'messages'},loadAll).on('postgres_changes',{event:'*',schema:'public',table:'friendships'},loadAll).subscribe()}

/* ---- data ---- */
async function loadAll(){
  const before=S.fr.filter(f=>f.status==='pending'&&f.addressee===S.me).map(f=>f.id);
  const[m,f]=await Promise.all([sb.from('messages').select('*').order('created_at',{ascending:false}).limit(500),sb.from('friendships').select('*')]);
  if(m.error||f.error){toast((m.error||f.error).message);return}

async function signed(p,d){const{data}=await sb.storage.from(BUCKET).createSignedUrl(p,3600,d?{download:d}:undefined);return data&&data.signedUrl}

const openLink=u=>{if(/^https?:\/\//i.test(u))window.open(u,'_blank','noopener,noreferrer')};

/* ---- render ---- */
function render(){

  const pend=S.fr.filter(f=>f.status==='pending'&&f.addressee===S.me).length;

$('composer').onsubmit=async e=>{e.preventDefault();const v=$('draft').value.trim();if(!v||!S.peer)return;$('draft').value='';
  const kind=/^https?:\/\/\S+$/i.test(v)?'link':'text';
  const{error}=await sb.from('messages').insert({recipient_id:S.peer,kind,content:v});
  if(error){$('draft').value=v;toast(error.message)}else loadAll()};
$('draft').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!matchMedia('(pointer:coarse)').matches){e.preventDefault();$('composer').requestSubmit()}});
$('pick').onclick=()=>$('file').click();
$('file').onchange=async e=>{const fs=[...e.target.files],to=S.peer;e.target.value='';
  for(const f of fs){
    if(f.size>MAX){toast(f.name+' > 50 MB');continue}
    toast(t('up')+' '+f.name);
    const p=S.me+'/'+Date.now()+Math.random().toString(36).slice(2,8)+'-'+f.name.replace(/[^\w.\-]+/g,'_');
    const u=await sb.storage.from(BUCKET).upload(p,f,{contentType:f.type||'application/octet-stream'});

    const r=await sb.from('messages').insert({recipient_id:to,kind:'file',content:f.name,file_path:p,file_size:f.size});
    if(r.error){await sb.storage.from(BUCKET).remove([p]);toast(r.error.message)}

  lb.replaceChildren(h('img',{src:u,alt:m.content,onclick:e=>e.stopPropagation()}),h('div',{class:'bar'},h('button',{class:'btn sm',onclick:e=>{e.stopPropagation();dl(m)}},t('dl')),h('button',{class:'btn sm',onclick:close},'×')));lb.onclick=close;lb.hidden=false}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('lb').hidden)$('lb').click()});

  const{error}=await sb.from('profiles').update({display_name,bio}).eq('id',S.me);if(error)return toast(error.message);
  Object.assign(S.prof,{display_name,bio});S.pp[S.me]=S.prof;toast(t('saved'));render()}
