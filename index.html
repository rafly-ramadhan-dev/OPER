<style>
:root{--bg:#000;--sf:#0d0d10;--sf2:#1c1c24;--ink:#f2f2f5;--mut:#8b8b98;--line:#23232b;--accent:#7f9bff;--on:#05050a;--danger:#ff8a80;color-scheme:dark;
--d:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--b:"Figtree",system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif}
[data-theme=dark]{--bg:#0e1524;--sf:#16203a;--sf2:#22305a;--ink:#e8eefc;--mut:#98a6c3;--line:#26335a}
[data-theme=light]{--bg:#eef2f6;--sf:#fff;--sf2:#e2e8f0;--ink:#14213d;--mut:#5b6b82;--line:#d5dde8;--accent:#2b50ff;--on:#fff;--danger:#c2362b;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font:400 1rem/1.5 var(--b);background:var(--bg);color:var(--ink)}
button,input,textarea{font:inherit;color:inherit}
h2{font:800 1.5rem/1.2 var(--d);margin:0 0 1rem;letter-spacing:-.01em}
h3{font:600 .95rem var(--b);color:var(--mut);margin:1.5rem 0 .5rem}
.btn{border:0;border-radius:12px;padding:.65rem 1.1rem;background:var(--accent);color:var(--on);font-weight:600;cursor:pointer}
.btn.sm{padding:.35rem .8rem}
.ghost{background:none;border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:.3rem .7rem;cursor:pointer}
.ghost:hover{color:var(--ink);border-color:var(--mut)}
input,textarea{width:100%;background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:.65rem .8rem}
.err{color:var(--danger);min-height:1.4rem;margin:.5rem 0 0;font-size:.9rem}
.empty{color:var(--mut)}

#auth,#setup,#mt{min-height:100dvh;display:grid;place-items:center;padding:1.25rem}
.card{width:100%;max-width:25rem;background:var(--sf);border:2px solid var(--ink);border-radius:16px;box-shadow:7px 7px 0 var(--accent);padding:1.5rem;display:grid;gap:.75rem}
.brand{font:800 2.2rem/1 var(--d);margin:0;letter-spacing:-.02em}
.or{text-align:center;color:var(--mut);margin:0}
.link{background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer;padding:0;justify-self:start}

#app{height:100vh;height:100dvh;display:grid;grid-template-columns:92px 340px 1fr}
body:not([data-tab=chats]) #app{grid-template-columns:92px 1fr}
body:not([data-tab=chats]) #side{display:none}
#nav{display:flex;flex-direction:column;gap:.3rem;padding:1.1rem .5rem;border-right:1px solid var(--line);background:var(--sf)}
#nav .logo{font:800 1.4rem var(--d);text-align:center;margin-bottom:1rem}
.tab{position:relative;background:none;border:0;color:var(--mut);font-weight:600;font-size:.85rem;padding:.75rem .25rem;border-radius:12px;cursor:pointer}
.tab.on{color:var(--ink);background:var(--sf2)}
.dot{position:absolute;top:.3rem;right:.5rem;min-width:1.1rem;height:1.1rem;border-radius:1rem;background:var(--accent);color:var(--on);font:700 .7rem/1.1rem var(--b);text-align:center;font-style:normal}
#side{border-right:1px solid var(--line);overflow:auto;padding:1.25rem .75rem}
#side h2{padding:0 .6rem}
.conv{display:flex;align-items:center;gap:.75rem;width:100%;padding:.65rem .6rem;border:0;border-radius:12px;background:none;text-align:left;cursor:pointer}
.conv:hover,.conv.on{background:var(--sf2)}
.av{width:2.6rem;height:2.6rem;border-radius:50%;background:var(--accent);color:var(--on);display:grid;place-items:center;font-weight:800;flex-shrink:0}
.cm{min-width:0;flex:1;display:flex;flex-direction:column}
.cm small{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv time{font-size:.75rem;color:var(--mut)}

#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#chead{display:flex;align-items:center;gap:.75rem;padding:.8rem clamp(1rem,4vw,3rem);border-bottom:1px solid var(--line);font-size:1.1rem}
.back{display:none;background:none;border:0;font-size:1.8rem;line-height:1;cursor:pointer;padding:0 .4rem}
#body{flex:1;overflow:auto;min-height:0}
.msgs{padding:1.25rem clamp(1rem,4vw,3rem);display:flex;flex-direction:column;gap:.35rem}
.pane{padding:1.75rem clamp(1rem,4vw,3rem);max-width:58rem;width:100%;margin:0 auto}
.row{display:flex}.row.me{justify-content:flex-end}
.bub{position:relative;max-width:min(34rem,82%);padding:.5rem .8rem .3rem;border-radius:18px;background:var(--sf2);overflow-wrap:anywhere}
.row.me .bub{background:var(--mine,var(--accent));color:var(--mon,var(--on));border-bottom-right-radius:6px}
.row.you .bub{border-bottom-left-radius:6px}
.bub time{display:block;font-size:.7rem;text-align:right}.tt{opacity:.65}.tk{margin-left:.3rem;padding:0 .3rem;border-radius:8px;background:rgba(0,0,0,.28);color:#fff;font-weight:700}.tk.rd{color:#53bdeb}
.bub a{color:inherit;text-decoration:underline}
.tx{white-space:pre-wrap}
.pic{display:block;max-width:100%;max-height:18rem;border-radius:12px;margin:.1rem 0 .3rem}
.file{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:block}
.file small,.file u{display:block;font-size:.8rem;opacity:.8}
.x{position:absolute;top:-.45rem;left:-.45rem;width:1.3rem;height:1.3rem;border-radius:50%;border:0;background:var(--line);color:var(--ink);cursor:pointer;opacity:0;line-height:1;padding:0}
.bub:hover .x,.x:focus-visible{opacity:1}
@media(hover:none){.x{opacity:.7}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.9)}to{opacity:1;transform:none}}
.bub.new{animation:pop .3s cubic-bezier(.2,1.3,.4,1);transform-origin:bottom left}
.row.me .bub.new{transform-origin:bottom right}
@media(prefers-reduced-motion:reduce){.bub.new{animation:none}}

#composer{position:relative;display:flex;gap:.5rem;align-items:flex-end;padding:.75rem clamp(1rem,4vw,3rem) calc(.75rem + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
#draft{field-sizing:content;min-height:2.8rem;max-height:8rem;resize:none;border-radius:22px;padding:.65rem 1rem}
#pick,#stb,#mic{width:2.8rem;height:2.8rem;border-radius:50%;border:1px solid var(--line);background:var(--sf);font-size:1.4rem;cursor:pointer;flex-shrink:0}
#composer .btn{height:2.8rem;border-radius:22px}

.chips,.seg{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.chip,.seg button{background:var(--sf);border:1px solid var(--line);border-radius:20px;padding:.35rem .9rem;cursor:pointer}
.chip.on,.seg .on{background:var(--accent);color:var(--on);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:.75rem}
.mc{display:flex;flex-direction:column;gap:.2rem;text-align:left;background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:.6rem;cursor:pointer;overflow:hidden}
.mc img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;margin-bottom:.2rem}
.mc b,.mc small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc small{color:var(--mut)}
.add{display:flex;gap:.5rem}
.frow{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.6rem 0;border-bottom:1px solid var(--line)}
.acts{display:flex;gap:.4rem}
.set{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:1rem}.set>p{margin:0 0 .5rem;color:var(--mut);font-size:.9rem}.set>p:first-child{color:var(--ink);font-weight:600;font-size:1rem}.narrow{max-width:40rem}
input[type=color]{width:3rem;height:2.4rem;padding:.15rem;cursor:pointer}
#toast{position:fixed;left:50%;bottom:1.25rem;transform:translate(-50%,1rem);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:10px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;z-index:9}
#toast.show{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.who{display:flex;align-items:center;gap:.6rem}.who .av{width:2.2rem;height:2.2rem;font-size:.9rem}
#chead .av{width:2.2rem;height:2.2rem;font-size:.9rem}
#chead .cm{line-height:1.2}
.bub.st{background:none!important;padding:0 .2rem}.stk{font-size:4rem;line-height:1.15;display:block}
.sp{position:absolute;bottom:calc(100% + .4rem);left:clamp(1rem,4vw,3rem);display:grid;grid-template-columns:repeat(6,1fr);gap:.2rem;background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:.5rem;box-shadow:0 8px 30px #0006;z-index:5}
.sp button{font-size:1.8rem;background:none;border:0;cursor:pointer;border-radius:8px;padding:.1rem .3rem}.sp button:hover{background:var(--sf2)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:grid;place-items:center;z-index:20;cursor:zoom-out}
#lb img{max-width:94vw;max-height:86vh;border-radius:8px}
#lb .bar{position:absolute;top:1rem;right:1rem;display:flex;gap:.5rem}

@media(prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}

.rt{display:flex;flex-direction:column;align-items:flex-end;gap:.25rem}
.ub{min-width:1.3rem;height:1.3rem;border-radius:1rem;background:var(--accent);color:var(--on);font:700 .75rem/1.3rem var(--b);text-align:center;padding:0 .35rem}
.conv.un b,.conv.un small{font-weight:700;color:var(--ink)}
[class*=fx-]{--nc:#7f9bff}
.fx-solid,.fx-glow,.fx-pulse{color:var(--nc)}
.fx-glow{text-shadow:0 0 .55em var(--nc)}
.fx-pulse{animation:pl 1.6s ease-in-out infinite}

.fx-shimmer{background-image:linear-gradient(90deg,var(--nc),#fff,var(--nc))}
.fx-rainbow{background-image:linear-gradient(90deg,#ff5f6d,#ffc371,#47e891,#3ac7ff,#b36bff,#ff5f6d);animation-duration:4s}

.fr-neon{box-shadow:0 0 0 3px var(--bg),0 0 0 5px #39ffb6,0 0 14px 4px #39ffb6aa}
.fr-gold{box-shadow:0 0 0 3px var(--bg),0 0 0 5px #ffd24a,0 0 12px 3px #ffb300aa}
.fr-rainbow{animation:rg 3s linear infinite}
@keyframes rg{0%,100%{box-shadow:0 0 0 3px var(--bg),0 0 0 5px #ff5f6d,0 0 14px 3px #ff5f6d99}33%{box-shadow:0 0 0 3px var(--bg),0 0 0 5px #47e891,0 0 14px 3px #47e89199}66%{box-shadow:0 0 0 3px var(--bg),0 0 0 5px #3ac7ff,0 0 14px 3px #3ac7ff99}}

.av{position:relative}.av .on{position:absolute;right:-1px;bottom:-1px;width:.72rem;height:.72rem;border-radius:50%;background:#3ddc84;border:2px solid var(--bg)}
.row.you{align-items:flex-end;gap:.5rem}.row .av{width:2rem;height:2rem;font-size:.8rem;flex-shrink:0}
.sn{font-size:.8rem;font-weight:600;margin-bottom:.1rem}
.sh{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:0 .6rem;margin-bottom:1rem}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:15;padding:1rem}
.mn{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:1rem;width:min(22rem,100%);max-height:80vh;overflow:auto;display:grid;gap:.5rem}
.mn>button:not(.btn){background:none;border:0;text-align:left;padding:.7rem .5rem;border-radius:10px;cursor:pointer}.mn>button:not(.btn):hover{background:var(--sf2)}
.chk{display:flex;align-items:center;gap:.6rem;padding:.25rem 0;cursor:pointer}.chk input{width:1.1rem;height:1.1rem}.chk .av{width:2rem;height:2rem;font-size:.8rem}

.sb{display:flex;gap:.7rem;overflow-x:auto;padding:0 .6rem .8rem;margin-bottom:.4rem;border-bottom:1px solid var(--line)}
